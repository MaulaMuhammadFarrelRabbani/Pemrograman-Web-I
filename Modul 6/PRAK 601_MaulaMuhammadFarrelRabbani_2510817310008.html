<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CREAMO</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
      background-color: #ffffff;
      color: #333333;
    }
    .navbar {
      background-color: #ffffff;
      border-bottom: 1px solid #dddddd;
      padding: 12px 30px;
    }
    .navbar-brand img {
      height: 40px;
    }
    .navbar-nav .nav-link {
      font-size: 0.8rem;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #333333;
      padding: 6px 14px;
    }
    .navbar-nav .nav-link:hover {
      color: #888888;
    }

    .hero {
      text-align: center;
      padding: 60px 20px 30px;
    }

    .hero h1 {
      font-size: 2rem;
      font-weight: bold;
      color: #222222;
      margin-bottom: 10px;
    }

    .hero h2 {
      font-size: 1rem;
      font-weight: bold;
      color: #444444;
      margin-bottom: 8px;
    }

    .hero p {
      font-size: 0.7rem;
      color: #aaaaaa;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .filter-area {
      text-align: center;
      padding: 20px 0 10px;
    }

    .filter-area button {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      font-size: 0.78rem;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #999999;
      padding: 6px 18px;
      margin: 4px;
      cursor: pointer;
    }

    .filter-area button:hover,
    .filter-area button.aktif {
      color: #333333;
      border-bottom: 2px solid #333333;
    }

    .gallery {
      padding: 20px 40px 60px;
    }

    .gallery-item {
      overflow: hidden;
    }

    .gallery-item img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .gallery-item img:hover {
      transform: scale(1.05);
    }

    .gallery-item.tersembunyi {
      display: none;
    }

    .lightbox {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }

    .lightbox.tampil {
      display: flex;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 85vh;
      border: 3px solid #ffffff;
    }

    .lightbox .tombol-tutup {
      position: absolute;
      top: 20px; right: 30px;
      font-size: 2rem;
      color: #ffffff;
      background: none;
      border: none;
      cursor: pointer;
    }

    footer {
      border-top: 1px solid #dddddd;
      text-align: center;
      padding: 40px 20px;
    }

    footer .logo-footer img {
      height: 35px;
      margin-bottom: 8px;
    }

    footer .logo-footer span {
      display: block;
      font-size: 1.3rem;
      font-weight: bold;
      color: #222222;
      margin-bottom: 6px;
    }

    footer .tagline {
      font-size: 0.68rem;
      color: #aaaaaa;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    footer .sosial a {
      color: #999999;
      font-size: 1rem;
      margin: 0 6px;
      text-decoration: none;
    }

    footer .sosial a:hover {
      color: #333333;
    }

    @media (max-width: 768px) {
      .hero h1 { font-size: 1.4rem; }
      .hero h2 { font-size: 0.9rem; }
      .gallery { padding: 20px 10px 40px; }
      .gallery-item img { height: 100px; }
    }

    @media (max-width: 480px) {
      .gallery-item img { height: 70px; }
      .filter-area button { font-size: 0.6rem; padding: 4px 7px; }
    }

    @media (max-width: 360px) {
      .gallery-item img { height: 55px; }
      .filter-area button { font-size: 0.55rem; padding: 3px 5px; letter-spacing: 1px; }
    }

    .corner {
      position: fixed;
      width: 35px;
      height: 35px;
      z-index: 99999;
      pointer-events: none;
    }
    .corner-tl {
      top: 0;
      left: 0;
      border-top: 6px solid #222222;
      border-left: 6px solid #222222;
    }
    .corner-tr {
      top: 0;
      right: 0;
      border-top: 6px solid #222222;
      border-right: 6px solid #222222;
    }
    .corner-bl {
      bottom: 0;
      left: 0;
      border-bottom: 6px solid #222222;
      border-left: 6px solid #222222;
    }
    .corner-br {
      bottom: 0;
      right: 0;
      border-bottom: 6px solid #222222;
      border-right: 6px solid #222222;
    }
  </style>
</head>

<body>
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <nav class="navbar d-flex justify-content-between align-items-center">
    <a href="#" class="navbar-brand">
      <img src="gambar/creamologo3.png" alt="Logo" style="height: 40px;">
    </a>

    <ul class="navbar-nav d-flex flex-row">
      <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
      <li class="nav-item"><a class="nav-link" href="#">About Us</a></li>
      <li class="nav-item"><a class="nav-link" href="#">Photos</a></li>
      <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
    </ul>

  </nav>

  <section class="hero">
    <h1>Hi, Hello.. I Am Maula Muhammad Farrel Rabbani (2510817310008)...!</h1>
    <h2><strong>I Travel Around The World To Get The Best Photos...!</strong></h2>
    <p>Award Winning Photographer &bull; Filmmaker &bull; Artist</p>
  </section>

  <div class="filter-area">
    <button class="aktif" data-filter="all">All</button>
    <button data-filter="landscape">Landscape</button>
    <button data-filter="portrait">Portrait</button>
    <button data-filter="product">Product</button>
  </div>

  <section class="gallery">
    <div class="container-fluid px-0">

      <div class="row g-2">

        <div class="col-3 gallery-item" data-category="landscape">
          <img src="Gambar/lsc1.jpg" alt="Landscape 1"
               onclick="bukaLightbox(this.src)">
        </div>

        <div class="col-3 gallery-item" data-category="landscape">
          <img src="Gambar/lsc2.JPG" alt="Landscape 2"
               onclick="bukaLightbox(this.src)">
        </div>

        <div class="col-3 gallery-item" data-category="portrait">
          <img src="Gambar/ptr1.jpg" alt="Portrait 1"
               onclick="bukaLightbox(this.src)">
        </div>

        <div class="col-3 gallery-item" data-category="landscape">
          <img src="Gambar/lsc3.jpg" alt="Landscape 3"
               onclick="bukaLightbox(this.src)">
        </div>

        <div class="col-3 gallery-item" data-category="portrait">
          <img src="Gambar/ptr2.jpg" alt="Portrait 2"
               onclick="bukaLightbox(this.src)">
        </div>

        <div class="col-3 gallery-item" data-category="portrait">
          <img src="Gambar/ptr3.jpg" alt="Portrait 3"
               onclick="bukaLightbox(this.src)">
        </div>

        <div class="col-3 gallery-item" data-category="portrait">
          <img src="Gambar/ptr4.jpg" alt="Portrait 4"
               onclick="bukaLightbox(this.src)">
        </div>

        <div class="col-3 gallery-item" data-category="portrait">
          <img src="Gambar/ptr5.jpg" alt="Portrait 5"
               onclick="bukaLightbox(this.src)">
        </div>

        <div class="col-3 gallery-item" data-category="product">
          <img src="Gambar/prd1.jpg" alt="Product 1"
               onclick="bukaLightbox(this.src)">
        </div>

        <div class="col-3 gallery-item" data-category="product">
          <img src="Gambar/prd2.jpg" alt="Product 2"
               onclick="bukaLightbox(this.src)">
        </div>

        <div class="col-3 gallery-item" data-category="landscape">
          <img src="Gambar/lsc4.JPG" alt="Landscape 4"
               onclick="bukaLightbox(this.src)">
        </div>

        <div class="col-3 gallery-item" data-category="landscape">
          <img src="Gambar/lsc5.jpg" alt="Landscape 5"
               onclick="bukaLightbox(this.src)">
        </div>

        <div class="col-3 gallery-item" data-category="portrait">
          <img src="Gambar/ptr6.jpg" alt="Portrait 6"
               onclick="bukaLightbox(this.src)">
        </div>

        <div class="col-3 gallery-item" data-category="landscape">
          <img src="Gambar/lsc6.jpg" alt="Landscape 6"
               onclick="bukaLightbox(this.src)">
        </div>

        <div class="col-3 gallery-item" data-category="landscape">
          <img src="Gambar/lsc7.jpg" alt="Landscape 7"
               onclick="bukaLightbox(this.src)">
        </div>

        <div class="col-3 gallery-item" data-category="portrait">
          <img src="Gambar/ptr7.jpg" alt="Portrait 7"
               onclick="bukaLightbox(this.src)">
        </div>

      </div>
    </div>
  </section>

  <div class="lightbox" id="lightbox" onclick="tutupLightbox()">
    <button class="tombol-tutup" onclick="tutupLightbox()">&times;</button>
    <img id="gambarLightbox" src="" alt="Preview" onclick="event.stopPropagation()">
  </div>

  <footer>
    <div class="logo-footer">
        <img src="gambar/creamologo3.png" alt="Logo" style="height: 40px;">
    </div>

    <p class="tagline">Copyrights 2026 &bull; all rights reserved</p>
    <div class="sosial">
      <a href="#" title="Instagram"><i class="bi bi-instagram"></i></a>
      <a href="#" title="Behance"><i class="bi bi-behance"></i></a>
      <a href="#" title="Dribbble"><i class="bi bi-dribbble"></i></a>
      <a href="#" title="Pinterest"><i class="bi bi-pinterest"></i></a>
      <a href="#" title="LinkedIn"><i class="bi bi-linkedin"></i></a>
      <a href="#" title="Facebook"><i class="bi bi-facebook"></i></a>
      <a href="#" title="Twitter"><i class="bi bi-twitter-x"></i></a>
    </div>

  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    var tombolFilter = document.querySelectorAll('.filter-area button');
    var semuaItem    = document.querySelectorAll('.gallery-item');

    tombolFilter.forEach(function(tombol) {
      tombol.addEventListener('click', function() {

        tombolFilter.forEach(function(t) { t.classList.remove('aktif'); });

        tombol.classList.add('aktif');

        var filter = tombol.getAttribute('data-filter');

        semuaItem.forEach(function(item) {
          var kategori = item.getAttribute('data-category');

          if (filter === 'all' || kategori === filter) {
            item.classList.remove('tersembunyi');
          } else {
            item.classList.add('tersembunyi');
          }
        });

      });
    });

    function bukaLightbox(src) {
      document.getElementById('gambarLightbox').src = src;
      document.getElementById('lightbox').classList.add('tampil');
    }

    function tutupLightbox() {
      document.getElementById('lightbox').classList.remove('tampil');
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') tutupLightbox();
    });
  </script>
</body>
</html>
